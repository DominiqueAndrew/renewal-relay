<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Renewal Relay architecture</title>
  <desc id="desc">An operator sends a renewal notice to a Cloud Run service. A background agent uses Gemini for extraction, a deterministic policy engine for decisions, reversible action tools, Firestore, and a human approval gate.</desc>
  <rect width="1400" height="520" fill="#f5f4ef"/>
  <style>
    .box { fill: #fffefa; stroke: #d9dad3; stroke-width: 2; }
    .green { fill: #dfece2; stroke: #b9d0bf; stroke-width: 2; }
    .coral { fill: #f9e5de; stroke: #e2a18f; stroke-width: 2; }
    .label { fill: #20231f; font: 600 19px 'Arial', sans-serif; }
    .small { fill: #71756d; font: 14px 'Arial', sans-serif; }
    .mono { fill: #2d5947; font: 500 12px monospace; letter-spacing: 1px; }
    .arrow { stroke: #2d5947; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#2d5947" stroke-width="1.5"/></marker></defs>
  <text x="60" y="55" class="mono">RENEWAL RELAY / SYSTEM MAP</text>
  <text x="60" y="93" class="label" font-size="29">From inbox noise to accountable next step</text>
  <rect x="60" y="180" width="190" height="112" rx="4" class="box"/>
  <text x="83" y="221" class="label">Operator</text><text x="83" y="250" class="small">synthetic notice</text><text x="83" y="273" class="small">read-only intake</text>
  <path d="M250 236 H325" class="arrow"/>
  <rect x="325" y="155" width="270" height="162" rx="4" class="green"/>
  <text x="350" y="202" class="label">Cloud Run service</text><text x="350" y="232" class="small">background run state</text><text x="350" y="255" class="small">HTTP API + live polling</text><text x="350" y="286" class="mono">NODE.JS / PORT 8080</text>
  <path d="M595 236 H675" class="arrow"/>
  <rect x="675" y="125" width="255" height="220" rx="4" class="box"/>
  <text x="700" y="171" class="label">Agent workers</text><text x="700" y="204" class="small">Gemini extraction</text><text x="700" y="230" class="small">deterministic policy</text><text x="700" y="256" class="small">reversible actions</text><text x="700" y="302" class="mono">GENAI SDK</text>
  <path d="M930 183 H1010" class="arrow"/><path d="M930 288 H1010" class="arrow"/>
  <rect x="1010" y="135" width="200" height="96" rx="4" class="coral"/>
  <text x="1035" y="176" class="label">Gemini 3.5</text><text x="1035" y="202" class="small">facts only</text>
  <rect x="1010" y="260" width="200" height="96" rx="4" class="green"/>
  <text x="1035" y="301" class="label">Firestore</text><text x="1035" y="327" class="small">run + audit record</text>
  <path d="M802 345 V415 H515" class="arrow"/>
  <rect x="300" y="415" width="430" height="70" rx="4" class="coral"/>
  <text x="328" y="457" class="label">Human approval gate</text><text x="600" y="457" class="small">no auto-send / no auto-cancel</text>
  <path d="M930 236 H1280 V415 H730" class="arrow"/>
</svg>
